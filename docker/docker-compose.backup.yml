# Override opcional que agrega el sidecar de backup diario (Postgres +
# MinIO). Se activa explícitamente con:
#   docker compose -f docker-compose.yml -f docker-compose.backup.yml up -d
# No se incluye en el compose principal para que levantar el stack base
# (dev local) no dependa de este volumen extra ni de compilar esta imagen.
services:
  backup:
    build:
      context: ./backup
    restart: unless-stopped
    environment:
      - PGHOST=postgres
      - PGPORT=5432
      - PGDATABASE=${POSTGRES_DB:-ige_informes}
      - PGUSER=${POSTGRES_USER:-ige_informes}
      - PGPASSWORD=${POSTGRES_PASSWORD}
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MINIO_BUCKET=ige-informes
      - BACKUP_RETENTION_DIAS=30
    volumes:
      - backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  backups:
    # Destino externo: carpeta compartida NFS dedicada en el QNAP
    # institucional (CATE911-NAS, 10.52.12.56), fuera del servidor donde
    # corre la VM — ver docs/07-plan-despliegue.md ("un backup que vive en
    # el mismo disco que falla no sirve"). Permiso NFS configurado en el
    # QNAP para el host 192.168.70.50 (IP real de la VM ige-informes),
    # lectura/escritura, sync, no_root_squash (necesario porque el sidecar
    # escribe como root dentro del contenedor). NFSv3 (única versión
    # habilitada en este QNAP).
    #
    # Path del export verificado 2026-08-05 con `showmount -e 10.52.12.56`
    # desde la VM: el QNAP expone la carpeta compartida directamente como
    # `/ige-informes-backups`, sin anteponer el nombre del volumen
    # (`RESGUARDO`).
    driver: local
    driver_opts:
      type: nfs
      o: addr=10.52.12.56,nfsvers=3,rw,soft,timeo=100,retrans=3
      device: ":/ige-informes-backups"
