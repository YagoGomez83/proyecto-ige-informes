services:
  reverse-proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "443:443"
      # TLS termination para el tráfico directo del navegador a MinIO (URLs
      # prefirmadas) — ver comentario en Caddyfile sobre por qué MinIO
      # necesita responder HTTPS acá aunque hable HTTP puro en la red
      # interna de Docker.
      - "9000:9000"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - ConnectionStrings__Default=Host=postgres;Port=5432;Database=${POSTGRES_DB:-ige_informes};Username=${POSTGRES_USER:-ige_informes};Password=${POSTGRES_PASSWORD}
      - IGE_ADMIN_EMAIL=${IGE_ADMIN_EMAIL:-}
      - IGE_ADMIN_PASSWORD=${IGE_ADMIN_PASSWORD:-}
      - IGE_SEED_TEST_USERS=${IGE_SEED_TEST_USERS:-false}
      - IGE_SEED_TEST_USERS_COUNT=${IGE_SEED_TEST_USERS_COUNT:-10}
      - Minio__Endpoint=minio:9000
      - Minio__EndpointPublico=${MINIO_ENDPOINT_PUBLICO:-localhost:9000}
      - Minio__AccessKey=${MINIO_ROOT_USER}
      - Minio__SecretKey=${MINIO_ROOT_PASSWORD}
      - Minio__BucketName=ige-informes
      - Minio__UseSsl=false
      - Minio__UseSslPublico=true
      - ClamAv__Host=clamav
      - ClamAv__Port=3310
    volumes:
      - dataprotection_keys:/keys
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      clamav:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    # ~1.2-1.5 GB en reposo con la base de firmas cargada (freshclam corre
    # en el propio contenedor al arrancar) — mem_limit acotado porque la
    # VM de producción tiene 6 GB totales compartidos con Postgres/MinIO/web
    # (ver docs/07-plan-despliegue.md). Si el healthcheck tarda en pasar la
    # primera vez, es la descarga inicial de la base de firmas (freshclam).
    mem_limit: 2g
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-ige_informes}
      - POSTGRES_USER=${POSTGRES_USER:-ige_informes}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ige_informes}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    # El puerto 9000 ya no se publica acá: Caddy hace de TLS termination
    # delante de MinIO para el tráfico del navegador (ver Caddyfile) y
    # reenvía a este servicio por la red interna de Docker. NO se publica
    # el 9001 (consola de administración de MinIO).
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
  miniodata:
  caddy_data:
  caddy_config:
  dataprotection_keys:
  clamav_data:
